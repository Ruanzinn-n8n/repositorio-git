<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-Up</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'rel='stylesheet'>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">

        <header>
            <h1>Sign-Up</h1>
        </header>
        <main>
            <form method="get" action="" onsubmit="return validarSenha()">
                <div class="input-box">
                    <label>Nome</label>
                    <input type="text" maxlength="15" placeholder="Seu login" required>
                </div>

                <div class="input-box">
                    <label>Email</label>
                    <input type="email" placeholder="Seu melhor email" required>
                </div>

                <div class="input-box">
                    <label>Senha</label>
                    <input type="password" id="senha" minlength="6" maxlength="20" placeholder="Escolha sua senha" required>
                </div>

                <div class="input-box">
                    <label>Confirme a senha</label>
                    <input type="password" id="confirmar-senha" minlength="6" maxlength="20" placeholder="Confirme sua senha" required>
                </div>

                <button type="submit" class="entrar">Criar</button>
            </form>
        </main>

        <p id="error" style="color: red;"></p>

    </div>
    <script>
        function validarSenha() {
            const senha = document.getElementById("senha").value;
            const confirmar = document.getElementById("confirmar-senha").value
            const erro = document.getElementById("error");

            if (senha !== confirmar) {
                erro.textContent = "A senhas são diferentes";
                return false;
            }

            erro.textContent = ""

            alert("conta criada com sucesso!");
            return true;
        }
    </script>

</body>
</html>
